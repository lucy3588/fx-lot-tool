<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FXロット計算ツール OANDA MT5版</title>
<meta name="theme-color" content="#0b1f4d">
<style>
body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#eef4ff,#f4f7fb);color:#101828}
.wrap{max-width:760px;margin:0 auto}
.hero{background:linear-gradient(180deg,#14347e,#0b1f4d);color:white;border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(11,31,77,.18)}
h1{margin:0 0 6px;font-size:28px}.sub{color:#ffe08a;font-size:13px;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.badge{background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}
.card{background:white;border:1px solid #e6ebf2;border-radius:22px;padding:16px;margin-top:14px;box-shadow:0 6px 18px rgba(16,24,40,.06)}
h2{margin:0 0 10px;font-size:20px}label{display:block;margin:10px 0 6px;font-size:13px;font-weight:700;color:#344054}
input,select{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:14px;font-size:18px;background:white;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.seg button{border:none;border-radius:14px;padding:14px 10px;font-size:17px;font-weight:800;background:#eef3ff;color:#1849a9}.seg button.active{background:#1849a9;color:white}
.quick,.quick2{display:grid;gap:8px;margin-top:8px}.quick{grid-template-columns:repeat(4,1fr)}.quick2{grid-template-columns:repeat(3,1fr)}
.quick button,.quick2 button{border:1px solid #e6ebf2;background:#f8fafc;border-radius:12px;padding:10px;font-weight:700}
.btn{width:100%;margin-top:14px;padding:16px;border:none;border-radius:16px;background:#1849a9;color:white;font-size:18px;font-weight:800}
.result{background:linear-gradient(180deg,#f8fbff,#eef4ff);border:1px solid #dbe6ff;border-radius:18px;padding:16px}
.main{font-size:30px;font-weight:900;color:#c62828;line-height:1.25}.subres{margin-top:8px;font-size:15px;line-height:1.7;font-weight:700;color:#344054}
.muted,.note{font-size:13px;color:#667085;line-height:1.65}.note{font-size:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #e5ebf4;padding:10px 8px;text-align:center;font-size:14px}th{background:#edf3ff;color:#1849a9;font-weight:900}tr:nth-child(even) td{background:#fbfdff}
.ok{color:#157347}.warn{color:#c62828}.pill{display:inline-block;background:#eef3ff;color:#1849a9;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.hidden{display:none}
@media(max-width:640px){.grid2,.grid3,.quick,.quick2{grid-template-columns:1fr 1fr}.main{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>FXロット計算ツール</h1><div class="sub">OANDA MT5対応 / 1lot=10万通貨 / +5/-5ボタン付き・分割比率変更対応</div><div class="badges"><div class="badge">EURUSD / USDJPY</div><div class="badge">2分割比率変更可</div><div class="badge">複利対応</div><div class="badge">1pip価値 自動計算</div></div></div>
<div class="card"><h2>入力</h2>
<div class="seg"><button id="btnEUR" class="active" type="button" onclick="setPair('EURUSD')">EURUSD</button><button id="btnJPY" type="button" onclick="setPair('USDJPY')">USDJPY</button></div>
<label>口座資金（円）</label><input id="balance" type="number" value="500000">
<div class="quick"><button onclick="setBalance(300000)">30万</button><button onclick="setBalance(500000)">50万</button><button onclick="setBalance(700000)">70万</button><button onclick="setBalance(1000000)">100万</button></div>
<div class="grid2"><div><label>リスク率（%）</label><input id="riskPct" type="number" value="0.65" step="0.01"></div><div><label>SL幅（pips）</label><input id="slPips" type="number" value="13" step="0.1"></div></div>
<div class="quick2"><button onclick="setRisk(0.30)">0.30%</button><button onclick="setRisk(0.50)">0.50%</button><button onclick="setRisk(0.65)">0.65%</button></div>
<div class="grid2"><div><label>1本目の配分（%）</label><input id="firstPct" type="number" value="50" step="1" min="0" max="100"></div><div><label>2本目の配分（自動）</label><input id="secondPct" type="text" value="50%" readonly></div></div>
<div class="quick2">
      <button type="button" onclick="changeSplit(-5)">−5%</button>
      <button type="button" onclick="setSplit(50)">50 / 50</button>
      <button type="button" onclick="changeSplit(5)">＋5%</button>
    </div>
    <div class="quick2">
      <button type="button" onclick="setSplit(25)">25 / 75</button>
      <button type="button" onclick="setSplit(30)">30 / 70</button>
      <button type="button" onclick="setSplit(35)">35 / 65</button>
    </div>
    <div class="quick2">
      <button type="button" onclick="setSplit(40)">40 / 60</button>
      <button type="button" onclick="setSplit(45)">45 / 55</button>
      <button type="button" onclick="setSplit(50)">50 / 50</button>
    </div>
<div class="grid2"><div id="usdjpyRateWrap"><label>USDJPY現在値（EURUSD計算用）</label><input id="usdjpyRate" type="number" value="150" step="0.01"></div><div><label>ロット刻み</label><select id="lotStep"><option value="0.01">0.01 lot</option><option value="0.001">0.001 lot</option></select></div></div>
<div class="grid3"><div><label>1lotあたり1pip価値（円）</label><input id="pipValueYen" type="text" readonly></div><div><label>1本目 lot</label><input id="firstLot" type="text" readonly></div><div><label>2本目 lot</label><input id="secondLot" type="text" readonly></div></div>
<div class="muted"><span class="pill">自動計算</span> 1本目の配分を変えると、2本目は自動で残りに変わります。</div><button class="btn" onclick="calc()">計算する</button></div>
<div class="card"><h2>結果</h2><div class="result"><div id="mainResult" class="main">-</div><div id="subResult" class="subres">-</div></div><div id="judgeText" class="note"></div></div>
<div class="card"><h2>pips帯の目安</h2><div class="muted">現在の入力値・分割比率から自動計算します。</div><table><thead><tr><th>SL帯</th><th>合計lot</th><th>1本目</th><th>2本目</th></tr></thead><tbody id="bandBody"></tbody></table></div>
<div class="card"><h2>計算根拠</h2><div id="logicText" class="muted"></div></div>
</div>
<script>
let currentPair='EURUSD';
function setPair(pair){currentPair=pair;btnEUR.classList.toggle('active',pair==='EURUSD');btnJPY.classList.toggle('active',pair==='USDJPY');usdjpyRateWrap.classList.toggle('hidden',pair==='USDJPY');calc();}
function setBalance(v){balance.value=v;calc();}
function setRisk(v){riskPct.value=v.toFixed(2);calc();}
function setSplit(v){firstPct.value=v;calc();}
function changeSplit(delta){
  let v=parseFloat(firstPct.value||0);
  v=Math.round((v+delta)/5)*5;
  if(v<0)v=0;
  if(v>100)v=100;
  firstPct.value=v;
  calc();
}
function num(id){return parseFloat(document.getElementById(id).value||0);}
function down(v,s){return Math.floor(v/s)*s;}
function fmt(v,s){return Number(v).toFixed(s===0.001?3:2);}
function pipVal(pair,rate){return pair==='USDJPY'?1000:10*rate;}
function split(total,fp,step){let f=down(total*(fp/100),step);let s=down(total-f,step);return [f,s];}
function calc(){
 let bal=num('balance'), risk=num('riskPct'), sl=num('slPips'), rate=num('usdjpyRate'), step=num('lotStep'), fp=num('firstPct');
 if(fp<0){fp=0;firstPct.value=0;} if(fp>100){fp=100;firstPct.value=100;}
 let sp=100-fp; secondPct.value=sp.toFixed(0)+'%';
 if(bal<=0||risk<=0||sl<=0||step<=0||(currentPair==='EURUSD'&&rate<=0)){mainResult.textContent='入力値を確認してください';return;}
 let pv=pipVal(currentPair,rate), riskYen=bal*(risk/100), raw=riskYen/(sl*pv), total=down(raw,step), lots=split(total,fp,step), actual=lots[0]+lots[1], loss=actual*sl*pv, pct=loss/bal*100;
 pipValueYen.value=pv.toLocaleString('ja-JP',{maximumFractionDigits:2}); firstLot.value=fmt(lots[0],step); secondLot.value=fmt(lots[1],step);
 mainResult.innerHTML='合計 '+fmt(actual,step)+' lot';
 subResult.innerHTML='1本目 '+fp.toFixed(0)+'% = '+fmt(lots[0],step)+' lot<br>2本目 '+sp.toFixed(0)+'% = '+fmt(lots[1],step)+' lot<br>理論値 '+raw.toFixed(4)+' lot / 想定損失 '+Math.round(loss).toLocaleString('ja-JP')+'円 ('+pct.toFixed(2)+'%)';
 judgeText.innerHTML=(pct<=risk?'<span class="ok">安全側に丸めています。</span>':'<span class="warn">リスク超過です。</span>')+' 計算式: '+bal.toLocaleString('ja-JP')+' × '+risk+'% ÷ ('+sl+' × '+pv.toLocaleString('ja-JP',{maximumFractionDigits:2})+')';
 logicText.innerHTML=currentPair==='USDJPY'?'USDJPY: 1lot=100,000通貨、1pip=0.01円 → 1,000円/pip<br>分割比率: '+fp.toFixed(0)+'% / '+sp.toFixed(0)+'%':'EURUSD: 1lot=100,000通貨、1pip=0.0001USD → 10USD/pip<br>USDJPY '+rate.toFixed(2)+'円で換算 → '+pv.toLocaleString('ja-JP',{maximumFractionDigits:2})+'円/pip<br>分割比率: '+fp.toFixed(0)+'% / '+sp.toFixed(0)+'%';
 let bands=[['5〜6',5.5],['7〜8',7.5],['9〜10',9.5],['11〜14',12.5],['15〜18',16.5],['19〜25',22],['26〜35',30.5]], h='';
 for(const [lab,p] of bands){let lot=down(riskYen/(p*pv),step), a=split(lot,fp,step);h+=`<tr><td>${lab} pips</td><td><b>${fmt(a[0]+a[1],step)}</b></td><td>${fmt(a[0],step)}</td><td>${fmt(a[1],step)}</td></tr>`}
 bandBody.innerHTML=h;
}
['balance','riskPct','slPips','usdjpyRate','lotStep','firstPct'].forEach(id=>{document.getElementById(id).addEventListener('input',calc);document.getElementById(id).addEventListener('change',calc);});
calc();
</script>
</body></html>
